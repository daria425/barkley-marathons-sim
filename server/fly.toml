app = "barkley-marathons-simulator"
primary_region = "iad"

[build]

# Default shared-cpu-1x is 256MB — too tight for FastAPI + langfuse/OTel instrumentation +
# the anthropic SDK + gpxpy parsing a ~5MB course file, and was causing an OOM crash loop in
# prod (see git history). 512MB gives real headroom without jumping to a dedicated CPU tier.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  SIM_DB_PATH = "/data/race.db"

[[mounts]]
  source = "sim_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"
