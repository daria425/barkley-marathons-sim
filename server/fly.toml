app = "barkley-marathons-simulator"
primary_region = "iad"

[build]

[env]
  SIM_DB_PATH = "/data/race.db"

[[mounts]]
  source = "sim_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"
