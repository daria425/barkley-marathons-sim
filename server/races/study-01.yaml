# Study race 01: fixed conditions for comparing models (docs/v2-plan.md, Phase 1).
# Every runner in every run of this config sees the same start hour, weather, events and
# hallucinations at the same elapsed_min. The only randomness left in the sim is GPS noise,
# derived from `seed` + tick index.
#
# Clock reference (start 06:00, daylight 07:00-19:00):
#   night   elapsed 0-60, 780-1500, 2220-2940   (day 1 06-07, day 1 19:00-day 2 07:00, day 2 19:00-day 3 07:00)
#   weather cycles every 360 min: clear 0-120, fog 120-240, rain 240-360, repeat
#
# Draft schedules below are hand-placed to fit those windows: wildlife only at night, puddles only
# in rain, trips only in fog/rain. Briars and bottle drops can happen anywhere. Edit freely.

name: study-01
seed: 20261031
start_hour: 6.0

weather_cycle:
  - { condition: clear, duration_min: 120 }
  - { condition: fog, duration_min: 120 }
  - { condition: rain, duration_min: 120 }

# ~one every 90 sim-minutes, 38 total over the 60h race
events:
  - { at_elapsed_min: 40, event: spooked_by_wildlife }    # pre-dawn, clear
  - { at_elapsed_min: 150, event: tripped_and_fell }      # fog
  - { at_elapsed_min: 290, event: stepped_in_puddle }     # rain
  - { at_elapsed_min: 400, event: briar_scratch }
  - { at_elapsed_min: 530, event: tripped_and_fell }      # fog
  - { at_elapsed_min: 640, event: stepped_in_puddle }     # rain
