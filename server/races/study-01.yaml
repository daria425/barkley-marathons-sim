  - { at_elapsed_min: 1260, event: tripped_and_fell }     # night 1, fog
  - { at_elapsed_min: 1330, event: spooked_by_wildlife }  # night 1, rain
  - { at_elapsed_min: 1420, event: stepped_in_puddle }    # night 1, rain
