# From 40h (CLAUDE.md's sleep-debt threshold), getting more frequent toward the cutoff.
# A sped-up slice shorter than 40h won't reach any of these.
hallucinations:
  - { at_elapsed_min: 2400, text: "You feel very anxious for no describable reason." }
  - { at_elapsed_min: 2520, text: "The trees are whispering your name." }
  - { at_elapsed_min: 2610, text: "The moon looks like a slice of pizza. You are extremely hungry." }  # night 2
  - { at_elapsed_min: 2700, text: "You hear someone laughing from somewhere in the trees. It sounds like Lazarus Lake." }
  - { at_elapsed_min: 2790, text: "You feel someone running just behind your left shoulder, matching your pace exactly." }
  - { at_elapsed_min: 2870, text: "You hear a phone ringing somewhere in the wilderness. There is no phone." }
  - { at_elapsed_min: 2960, text: "Your feet feel like they belong to someone else." }
  - { at_elapsed_min: 3040, text: "You could swear you just saw a vending machine in the middle of the woods." }
  - { at_elapsed_min: 3110, text: "You see a bear watching you from the ridge. It waves back when you wave." }
  - { at_elapsed_min: 3180, text: "A stranger in a yellow raincoat says you're almost done. There is no stranger." }
  - { at_elapsed_min: 3240, text: "The trail markers spell out your bib number in a language you don't speak." }
  - { at_elapsed_min: 3300, text: "A conversation with your mother from third grade replays in your head, word for word." }
  - { at_elapsed_min: 3360, text: "You're certain you just passed your own house, though you've never been to Tennessee." }
  - { at_elapsed_min: 3420, text: "You're briefly convinced this is a dream, and you're still asleep at the start line." }
  - { at_elapsed_min: 3480, text: "You see the finish line. It's a mirage." }
  - { at_elapsed_min: 3540, text: "The trees are whispering your name." }
